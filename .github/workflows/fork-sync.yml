# Auto-sync your fork with upstream, weekly.
# Copy this file into your fork, at .github/workflows/fork-sync.yml
# Runs every Monday 09:00 UTC, pulls upstream main into your main,
# which triggers ghcr-build.yml to rebuild and push a new image.
# No secrets needed. Delete this file if you prefer manual sync.

name: Sync fork with upstream

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/cubicecho/mcp-skills-manager.git
          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
