# Build the container image in GitHub Actions and push it to your GHCR.
# Copy this file into your fork, at .github/workflows/ghcr-build.yml
# No secrets needed, GITHUB_TOKEN is provided by GitHub Actions.
# Image: ghcr.io/<your-username>/mcp-skills-manager:latest
# Run it from the Actions tab, workflow_dispatch, or on every push to main.

name: Build image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
